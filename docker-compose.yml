version: '3.8'

services:
  nginx:
    image: nginxproxy/nginx-proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - certs:/etc/nginx/certs
      - vhost:/etc/nginx/vhost.d
      - html:/usr/share/nginx/html
      - /var/run/docker.sock:/tmp/docker.sock:ro

  acme-companion:
    image: nginxproxy/acme-companion
    restart: always
    environment:
      - DEFAULT_EMAIL=${LETSENCRYPT_EMAIL:-admin@ieeecusb.org}
    volumes:
      - certs:/etc/nginx/certs
      - vhost:/etc/nginx/vhost.d
      - html:/usr/share/nginx/html
      - acme:/etc/acme.sh
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - nginx

  postgres:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-ieeecusb}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  minio:
    image: quay.io/minio/minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-admin12345}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  minio-create-bucket:
    image: quay.io/minio/mc
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc config host add myminio http://minio:9000 ${MINIO_ROOT_USER:-admin} ${MINIO_ROOT_PASSWORD:-admin12345};
      /usr/bin/mc rm -r --force myminio/${BB_BUCKET_NAME:-ieee-storage} || true;
      /usr/bin/mc mb myminio/${BB_BUCKET_NAME:-ieee-storage};
      /usr/bin/mc anonymous set public myminio/${BB_BUCKET_NAME:-ieee-storage};
      exit 0;
      "

  backend:
    build: .
    restart: always
    environment:
      - VIRTUAL_HOST=api.ieeecusb.org
      - LETSENCRYPT_HOST=api.ieeecusb.org
      - VIRTUAL_PORT=3000
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-ieeecusb}
      - REDIS_URL=redis://redis:6379
      - BB_ENDPOINT=http://minio:9000
      - BB_ACCESS_KEY_ID=${MINIO_ROOT_USER:-admin}
      - BB_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD:-admin12345}
      - BB_BUCKET_NAME=${BB_BUCKET_NAME:-ieee-storage}
      - BB_REGION=us-east-1
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
      - minio

volumes:
  postgres_data:
  redis_data:
  minio_data:
  certs:
  vhost:
  html:
  acme:
